name: Tests

# Unit tests for the asset pipeline scripts (scripts/assets/*.test.mjs) and the pointer-assets plugin
# (plugins/pointer-assets/*.test.cjs). The build runs only the fast plugin tests, because they guard
# the site build; the asset pipeline tests start many git processes, so they run here instead.
#
# This is a plain pull_request workflow: it runs the PR's own code with a read-only token and no
# secrets, which is safe, and it is why a fork PR gets its own test run.

on:
  pull_request:
  push:
    branches: [main, release, docs]

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # No install scripts: the tests need neither the optimizer binaries nor the git hooks.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the tests
        run: npm test
