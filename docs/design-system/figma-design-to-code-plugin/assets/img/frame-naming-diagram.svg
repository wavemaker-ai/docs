<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="640" height="260" fill="#ffffff"/>

  <text x="160" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#dc2626">Incorrect</text>
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#16a34a">Correct</text>

  <!-- Incorrect chips -->
  <g font-size="13">
    <rect x="45" y="46" width="230" height="34" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="68" fill="#7f1d1d" font-family="monospace">1Header</text>
    <text x="245" y="68" fill="#dc2626" font-size="16">✕</text>

    <rect x="45" y="90" width="230" height="34" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="112" fill="#7f1d1d" font-family="monospace">$Section!</text>
    <text x="245" y="112" fill="#dc2626" font-size="16">✕</text>

    <rect x="45" y="134" width="230" height="34" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="58" y="156" fill="#7f1d1d" font-family="monospace">2ndRow</text>
    <text x="245" y="156" fill="#dc2626" font-size="16">✕</text>
  </g>

  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Starts with a number or symbol —</text>
  <text x="160" y="215" text-anchor="middle" font-size="11" fill="#6b7280">breaks CSS class/id naming rules</text>

  <!-- Correct chips -->
  <g font-size="13">
    <rect x="365" y="46" width="230" height="34" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="378" y="68" fill="#14532d" font-family="monospace">header</text>
    <text x="565" y="68" fill="#16a34a" font-size="16">✓</text>

    <rect x="365" y="90" width="230" height="34" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="378" y="112" fill="#14532d" font-family="monospace">section</text>
    <text x="565" y="112" fill="#16a34a" font-size="16">✓</text>

    <rect x="365" y="134" width="230" height="34" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="378" y="156" fill="#14532d" font-family="monospace">second-row</text>
    <text x="565" y="156" fill="#16a34a" font-size="16">✓</text>
  </g>

  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Starts with a letter; hyphen/underscore</text>
  <text x="480" y="215" text-anchor="middle" font-size="11" fill="#6b7280">used for spaces</text>
</svg>
