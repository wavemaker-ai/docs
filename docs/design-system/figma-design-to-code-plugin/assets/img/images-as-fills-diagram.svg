<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="640" height="280" fill="#ffffff"/>

  <!-- Incorrect label -->
  <text x="160" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#dc2626">Incorrect</text>

  <!-- Incorrect: Frame with nested Image component -->
  <rect x="40" y="44" width="240" height="180" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="52" y="64" font-size="12" fill="#3b82f6">Frame</text>

  <rect x="80" y="90" width="160" height="110" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#ef4444">Image (Component)</text>

  <!-- image icon -->
  <g transform="translate(130,125)">
    <rect x="0" y="0" width="60" height="45" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="5" fill="#fbbf24"/>
    <path d="M0 40 L20 22 L34 34 L48 18 L60 34 L60 45 L0 45 Z" fill="#93c5fd"/>
  </g>

  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#6b7280">Extra component layer wraps the image</text>

  <!-- Correct label -->
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#16a34a">Correct</text>

  <!-- Correct: Frame with Fill = image, no nesting -->
  <rect x="360" y="44" width="240" height="180" rx="6" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="372" y="64" font-size="12" fill="#16a34a">Frame — Fill: Image</text>

  <g transform="translate(450,110)">
    <rect x="0" y="0" width="60" height="45" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="5" fill="#fbbf24"/>
    <path d="M0 40 L20 22 L34 34 L48 18 L60 34 L60 45 L0 45 Z" fill="#93c5fd"/>
  </g>

  <text x="480" y="240" text-anchor="middle" font-size="11" fill="#6b7280">Image applied directly as the frame's fill</text>
</svg>
